<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Форма регистрации</title>
		<link rel="stylesheet" href="./Форма контактов.css">
	</head>
	<body>
		<main>
			<div class="container">
				<h1>Регистрация</h1>
				<p>Уже есть аккаунт&#63 <a href="#" target="_blank">Войти</a></p>
				<form action="#" class="registerform" id="form_register">
					<input type=" text" placeholder="Компания" name="company" id="company" class="item">
					<div class="first_last_name">
						<input type="text" placeholder="Имя" name="first_name" id="firstname" class="item item1">
	
						<input type="text" placeholder="Фамилия" name="last_name" id="lastname" class="item item2">
					</div>
					<input type="email" placeholder="E-mail" name="email" id="E-mail" class="item">
					<button type="submit">Зарегистрироваться</button>
					<div class="checkbox item">
						<input type="checkbox" name="agreement" id="agreement" required>
						<label for="agreement">
							<span>Я прочитал и принимаю</span>
							<a href="#" target="_blank">Условия использования</a>
						</label>
					</div>
				</form>
			</div>
		</main>
		</body>
</html>
